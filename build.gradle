plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.allpick'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

	implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    // 브라우저 스모크 테스트 (e2e 태그) — 실제 페이지를 띄워 접속·메시지·의견 폼을 확인한다
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'com.microsoft.playwright:playwright:1.63.0'
}

// 기본 test 에서는 브라우저 테스트를 뺀다. 브라우저 다운로드가 필요하고 느리며,
// CodeFoundry 에이전트가 돌리는 환경(외부 출구 화이트리스트)에서는 브라우저를 받을 수 없다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'e2e'
	}
}

tasks.register('e2eTest', Test) {
	description = '브라우저 스모크 테스트 (Playwright + 내장 Kafka)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	shouldRunAfter tasks.named('test')
}

// CI 에서 e2eTest 전에 한 번: chromium 과 그 시스템 의존성 설치.
// 로컬은 첫 실행 때 Playwright 가 브라우저를 알아서 받으므로 필요 없다.
tasks.register('playwrightInstall', JavaExec) {
	description = 'Playwright chromium 설치 (--with-deps)'
	group = 'verification'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'
	args 'install', '--with-deps', 'chromium'
}
