# CodeFoundry 자동 머지의 관문 — 이 검사가 초록일 때만 팩토리 PR이 머지된다.
# 이 파일은 사람이 관리한다: 팩토리 PAT에는 Workflows 권한이 없다(의도적).
# 자동 머지는 이 워크플로 실행 전체의 결론을 본다 — 아래 두 job 이 모두 초록이어야 한다.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"        # build.gradle toolchain과 일치
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test

  # 브라우저 스모크 테스트 — 실제 chat-client.html 로 접속·메시지 왕복(내장 Kafka)·의견 폼 확인
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon playwrightInstall
      - run: ./gradlew --no-daemon e2eTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: build/reports/tests/e2eTest/
